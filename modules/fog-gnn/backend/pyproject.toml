[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fog-gnn"
version = "0.1.0"
description = "Módulo B: Predição de Freezing of Gait (FOG) em Parkinson com GNN espaço-temporal sobre sensores IMU"
requires-python = ">=3.11"
dependencies = [
    "ic-core",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "networkx>=3.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
]
pyg = [
    "torch>=2.4.0",
    "torch-geometric>=2.6.0",
]

[tool.uv.sources]
ic-core = { path = "../../../packages/core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fog_gnn"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["fog_gnn"]

[[tool.mypy.overrides]]
module = ["scipy.*", "networkx.*", "torch.*", "torch_geometric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

